[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "global-auto-intelligence-backend"
version = "0.1.0"
description = "Phase 1 backend skeleton for deterministic automotive KD policy and tax decisions"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "jsonschema>=4.25,<5",
  "pyyaml>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "pypdf>=6.0,<7",
  "PyJWT[crypto]>=2.10,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
pythonpath = ["."]
markers = [
  "integration: requires the migrated local PostgreSQL IAM schema",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
